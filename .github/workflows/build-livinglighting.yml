name: Build LivingLighting Fire TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LivingLighting-v2-SOURCE.zip'
      - '.github/workflows/build-livinglighting.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source archive exists
        run: |
          test -s LivingLighting-v2-SOURCE.zip || { echo "::error::Missing source archive"; exit 1; }
          unzip -t LivingLighting-v2-SOURCE.zip >/dev/null

      - name: Unpack LivingLighting Android project
        run: |
          mkdir -p source
          unzip -q LivingLighting-v2-SOURCE.zip -d source
          test -f source/LivingLighting/gradlew
          test -f source/LivingLighting/app/build.gradle.kts
          # API 37 is not published in the runner SDK feed; API 36 supports Fire TV builds.
          sed -i "s/compileSdk = 37/compileSdk = 36/; s/targetSdk = 37/targetSdk = 36/" source/LivingLighting/app/build.gradle.kts
          # API 37 constants are not provided by API 36; use compatible literal constants.
          sed -i 's/Manifest.permission.ACCESS_LOCAL_NETWORK/"android.permission.ACCESS_LOCAL_NETWORK"/; s/Build.VERSION_CODES.CINNAMON_BUN/37/' source/LivingLighting/app/src/main/java/com/vasmarfas/UniversalAmbientLight/common/util/LocalNetworkAccess.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK from runner image
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then echo "::error::Android SDK manager missing from runner image"; exit 1; fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build debug APK
        working-directory: source/LivingLighting
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleFullDebug

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LivingLighting-FireTV-APK
          path: source/LivingLighting/app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error
          retention-days: 30
