name: Publish LivingLighting Fire TV release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-firetv-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source and license
        uses: actions/checkout@v4

      - name: Download verified Android build from successful workflow
        uses: actions/download-artifact@v4
        with:
          name: LivingLighting-FireTV-APK
          repository: bawszy/Living-Lighting
          run-id: 42850503702
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded

      - name: Verify and rename the installable APK
        shell: bash
        run: |
          set -euo pipefail
          test -s downloaded/app-full-debug.apk
          mkdir -p release
          mv downloaded/app-full-debug.apk release/LivingLighting-v2-FireTV.apk
          unzip -p LivingLighting-v2-SOURCE.zip LivingLighting/LICENSE.txt > release/LICENSE.txt
          test -s release/LICENSE.txt
          sha256sum release/LivingLighting-v2-FireTV.apk
          unzip -t LivingLighting-v2-SOURCE.zip >/dev/null

      - name: Write release details
        shell: bash
        run: |
          cat > release_notes.md <<'EOF'
          LivingLighting v2 Fire TV — personal noncommercial beta.

          This APK is a signed Android debug build, compiled successfully from the LivingLighting-v2-SOURCE.zip project in GitHub Actions build #8 (run 42850503702). It has not yet been tested on the user's Fire TV Stick. Install at your own risk and keep the original Universal Ambient Light installed as backup.

          Default WLED layout: shelves 1–240, TV 241–354, lamp 355–389. No wiring changes. Turn off Universal Ambient Light capture before running LivingLighting to prevent conflicting LED commands.

          Known limitation: DRM-protected video apps, including Netflix, cannot be guaranteed to supply capturable video frames. The app does not bypass DRM.

          Based on Universal Ambient Light, used under PolyForm Noncommercial 1.0.0. Personal noncommercial use only. See accompanying LICENSE.txt and source ZIP in the repository.
          EOF

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.0.0-beta >/dev/null 2>&1; then
            gh release upload v2.0.0-beta release/LivingLighting-v2-FireTV.apk release/LICENSE.txt --clobber
          else
            gh release create v2.0.0-beta release/LivingLighting-v2-FireTV.apk release/LICENSE.txt --title "LivingLighting v2 — Fire TV beta" --notes-file release_notes.md --prerelease --target "$GITHUB_SHA"
          fi
          gh release view v2.0.0-beta --json url,assets
